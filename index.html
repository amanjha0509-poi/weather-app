<!DOCTYPE html>

<html>

<head>
    <title>Advanced Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1>Weather App</h1>

```
<div class="search-box">
    <input type="text" id="cityInput" placeholder="Enter city name">
    <button onclick="getWeather()">Search</button>
</div>

<div class="weather-info" id="weatherInfo">
    <p>Temperature: <span id="tempC">--</span> °C / <span id="tempF">--</span> °F</p>
    <p>Humidity: <span id="humidity">--</span>%</p>
    <p>Wind Speed: <span id="wind">--</span> m/s</p>
    <p>Condition: <span id="condition">--</span></p>
    <p>Sunrise: <span id="sunrise">--</span></p>
    <p>Sunset: <span id="sunset">--</span></p>
    <p>Precipitation Probability: <span id="pop">--</span>%</p>
    <p>AQI: <span id="aqi">--</span></p>
</div>
```

</div>

<script src="script.js"></script>

</body>
</html>
